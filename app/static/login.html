<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · My AI Team</title><link rel="stylesheet" href="/static/styles.css?v=standard-4"></head><body><main class="shell" style="max-width:520px"><header><div class="eyebrow">PRIVATE WORKSPACE</div><h1>My AI Team</h1><p>Enter the access token configured by the app owner.</p></header><form id="login-form" class="composer"><label>Access token<input id="token" type="password" required autocomplete="current-password"></label><button type="submit">Open workspace</button><div id="status" class="notice"></div></form></main><script>document.querySelector('#login-form').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:document.querySelector('#token').value})});if(r.ok)location.href='/';else document.querySelector('#status').textContent='Invalid access token.'}</script></body></html>
